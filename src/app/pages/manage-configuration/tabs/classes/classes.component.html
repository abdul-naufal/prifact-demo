<div class="classes-container">
    <!-- Left Panel: Class List -->
    <div class="left-panel">
        <div class="panel-header">
            <button class="btn btn-primary btn-add-class" (click)="addClass()">Add Class</button>
        </div>
        <div class="class-list">
            <div *ngFor="let cls of classes" class="class-item" [class.active]="selectedClass === cls"
                (click)="selectClass(cls)">
                <span class="class-name">{{ cls }}</span>
                <span class="class-subtext">({{ cls }})</span>
                <div class="item-actions">
                    <button class="btn-icon"><i class="material-icons">edit</i></button>
                    <button class="btn-icon delete"><i class="material-icons">delete</i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Middle Panel: Subject/Allocation List -->
    <div class="middle-panel">
        <div class="list-container">
            <div *ngFor="let subject of subjects" class="list-item" [class.active]="selectedSubject === subject"
                (click)="selectSubject(subject)">
                <div class="item-content">
                    <span class="item-title">{{ subject.name }}</span>
                    <span class="item-subtitle">({{ subject.code }})</span>
                </div>
                <button class="btn-icon delete"><i class="material-icons">delete</i></button>
            </div>
        </div>
    </div>

    <!-- Right Panel: Constraints Editor -->
    <div class="right-panel">
        <div class="constraints-container" *ngIf="selectedSubject">
            <div class="constraints-header">
                <div class="col-slot">Slot</div>
                <div class="col-constraints">
                    <span>Constraints</span>
                    <button class="btn-icon-small"><i class="material-icons">add</i></button>
                </div>
            </div>

            <div class="constraints-body">
                <!-- Instructors Section -->
                <div class="instructors-section">
                    <div class="section-header">
                        <h5>Instructors</h5>
                        <button class="btn-icon-small add" (click)="addTeacher(selectedSubject)" title="Add Instructor">
                            <i class="material-icons">add</i>
                        </button>
                    </div>
                    <div class="instructors-list">
                        <div *ngFor="let teacher of selectedSubject.teachers; let i = index" class="instructor-item">
                            <span class="instructor-name">{{ teacher }}</span>
                            <button class="btn-icon-small delete" (click)="removeTeacher(selectedSubject, i)"
                                title="Remove Instructor">
                                <i class="material-icons">close</i>
                            </button>
                        </div>
                        <div *ngIf="selectedSubject.teachers.length === 0" class="no-instructors">
                            No instructors assigned.
                        </div>
                    </div>
                </div>

                <div class="allow-on-section">
                    <label>Allow on:</label>
                    <span class="allow-values">13 15 20 33</span>
                </div>

                <!-- Grid with Slot Controls and Delete Button -->
                <div class="grid-with-controls">
                    <!-- Slot Controls - Left Side -->
                    <div class="slot-controls-sidebar">
                        <div class="slot-controls-content">
                            <button class="btn-slot-control">-</button>
                            <span class="slot-number">1</span>
                            <button class="btn-slot-control">+</button>
                        </div>
                    </div>

                    <!-- Timetable Grid -->
                    <div class="grid-container">
                        <!-- Header Row -->
                        <div class="grid-row header">
                            <div class="grid-cell empty"></div>
                            <div *ngFor="let p of periods" class="grid-cell">{{ p }}</div>
                        </div>

                        <!-- Day Rows -->
                        <div *ngFor="let day of days; let i = index" class="grid-row">
                            <div class="grid-cell day-label">
                                {{ day }}
                            </div>
                            <div *ngFor="let p of periods" class="grid-cell clickable-cell"
                                [class.selected]="isSlotSelected(day, p)" (click)="toggleSlot(day, p)">
                            </div>
                        </div>
                    </div>

                    <!-- Delete Button - Right Side -->
                    <div class="delete-button-sidebar">
                        <button class="btn-delete-timetable" title="Delete Timetable">
                            <i class="material-icons">delete</i>
                        </button>
                    </div>
                </div>

                <div class="total-periods">
                    <strong>Total Periods: {{ selectedSubject.totalPeriods }}</strong>
                </div>

                <div class="panel-actions">
                    <button class="btn btn-primary">Save</button>
                    <button class="btn btn-danger">Cancel</button>
                </div>
            </div>
        </div>
        <div class="empty-state" *ngIf="!selectedSubject">
            <p>Select an item to view details</p>
        </div>
    </div>
</div>
