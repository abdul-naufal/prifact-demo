<div class="instructors-container">
    <div class="header-section">
        <h2>Instructors</h2>
        <button class="btn" (click)="onCreate()" *ngIf="!isCreating">Create New Instructor</button>
    </div>

    <div class="create-form" *ngIf="isCreating">
        <h3>{{ isEditing ? 'Edit Instructor' : 'Add New Instructor' }}</h3>
        <div class="form-row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" class="form-control" placeholder="First Name" [(ngModel)]="newTeacher.firstName">
            </div>
            <div class="form-group">
                <label>Middle Name</label>
                <input type="text" class="form-control" placeholder="Middle Name" [(ngModel)]="newTeacher.middleName">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" class="form-control" placeholder="Last Name" [(ngModel)]="newTeacher.lastName">
            </div>
            <div class="form-group">
                <label>Code</label>
                <input type="text" class="form-control" placeholder="Code" [(ngModel)]="newTeacher.code">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" (click)="onSave()">{{ isEditing ? 'Update' : 'Save' }}</button>
            <button class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        </div>
    </div>

    <div class="list-view" *ngIf="!isCreating">
        <table class="table">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Middle Name</th>
                    <th>Last Name</th>
                    <th>Code</th>
                    <th class="actions-header">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let teacher of teachers">
                    <td>{{ teacher.firstName }}</td>
                    <td>{{ teacher.middleName }}</td>
                    <td>{{ teacher.lastName }}</td>
                    <td>{{ teacher.code }}</td>
                    <td class="actions-cell">
                        <button class="icon-btn" title="Edit" (click)="onEdit(teacher)">✎</button>
                        <button class="icon-btn" title="Delete" (click)="onDelete(teacher)">🗑</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
