<div class="question-papers-container">
  <div class="header">
    <h2>Question Papers</h2>
    <button class="create-btn" routerLink="/question-papers/create">Create New</button>
  </div>


  <div class="table-controls">
    <div class="entries-control">
      Show
      <select class="form-control entries-select">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
      entries
    </div>
    <div class="search-control">
      <label>Search:</label>
      <input type="text" class="form-control search-input" placeholder="">
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Course & Subject</th>
          <th>Total Marks</th>
          <th>Created by</th>
          <th>Last Updated</th>
          <th>Status</th>
          <th>Share</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let paper of questionPapers">
          <td>{{ paper.title }}</td>
          <td>{{ paper.course }} - {{ paper.subject }}</td>
          <td>{{ paper.totalMarks }}</td>
          <td>{{ paper.createdBy }}</td>
          <td>{{ paper.lastUpdated | date:'mediumDate' }}</td>
          <td>
            <span class="status-badge" [ngClass]="paper.status.toLowerCase()">
              {{ paper.status }}
            </span>
          </td>
          <td>
            <input type="checkbox">
          </td>
          <td>
            <button class="action-menu-btn">⋮</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
