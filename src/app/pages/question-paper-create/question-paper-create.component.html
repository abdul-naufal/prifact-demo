<div class="create-container">
    <div class="form-header">
        <h2>Create Question Paper</h2>
    </div>

    <div class="form-content">
        <div class="form-group">
            <label for="course">Course <span class="required">*</span></label>
            <select id="course" [(ngModel)]="selectedCourse" (ngModelChange)="onCourseChange()" class="form-control"
                required>
                <option value="" disabled selected>Select Course</option>
                <option *ngFor="let c of courses" [value]="c">{{ c }}</option>
            </select>
        </div>

        <div class="form-group" *ngIf="selectedCourse">
            <label for="subject">Subject <span class="required">*</span></label>
            <select id="subject" [(ngModel)]="selectedSubject" class="form-control" required>
                <option value="" disabled selected>Select Subject</option>
                <option *ngFor="let subject of subjects" [value]="subject">{{ subject }}</option>
            </select>
        </div>

        <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input type="text" id="title" [(ngModel)]="title" placeholder="Question paper title" class="form-control"
                required>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" (click)="onSave()"
                [disabled]="!selectedCourse || !selectedSubject || !title">
                Save
            </button>
            <button class="btn btn-secondary" (click)="onCancel()">
                Cancel
            </button>
        </div>
    </div>
</div>
