<div class="syllabus-container">
    <div class="header">
        <h2>Manage Syllabus</h2>
        <div class="actions">
            <button class="btn btn-outline">Import Subjects</button>
            <button class="btn">Create New Syllabus</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of syllabusList">
                    <td>{{ item.title }}</td>
                    <td>{{ item.description }}</td>
                    <td class="actions-cell">
                        <a [routerLink]="['/manage-syllabus', item.id]" class="icon-btn" title="Manage">⚙</a>
                        <button class="icon-btn" [disabled]="item.isLocked"
                            [title]="item.isLocked ? 'Locked' : 'Delete'">
                            <span *ngIf="!item.isLocked">🗑</span>
                            <span *ngIf="item.isLocked">🔒</span>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
