<div class="table-controls">
    <div class="entries-control">
        Show
        <select class="form-control entries-select">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
        </select>
        entries
    </div>
    <div class="search-control">
        <label>Search:</label>
        <input type="text" class="form-control search-input" placeholder="">
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Batch</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let config of configurations">
                <td>{{ config.name }}</td>
                <td>{{ config.course }}</td>
                <td>{{ config.batch }}</td>
                <td>
                    <span class="status-badge" [class.inactive]="config.status === 'Failed'"
                        [class.pending]="config.status === 'Configuring'" [class.draft]="config.status === 'Queued'"
                        [class.active]="config.status === 'Completed'">
                        {{ config.status }}
                    </span>
                </td>
                <td class="actions-cell">
                    <button class="icon-btn" title="Edit">✎</button>
                    <button class="icon-btn" title="Delete">🗑</button>
                    <button class="icon-btn" title="View">👁</button>
                    <button *ngIf="config.status === 'Configuring'" class="icon-btn" title="Manage"
                        (click)="onManage(config)">⚙</button>
                    <button *ngIf="config.status === 'Completed'" class="icon-btn icon-btn-warning" title="Manage"
                        (click)="onView(config)">⚙</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
