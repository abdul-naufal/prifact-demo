<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Class</th>
                <th>Division</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let config of configurations">
                <td>{{ config.name }}</td>
                <td>{{ config.class }}</td>
                <td>{{ config.division }}</td>
                <td>
                    <span class="badge" [class.active]="config.status === 'Active'"
                        [class.inactive]="config.status === 'Inactive'"
                        [class.configuring]="config.status === 'Configuring'"
                        [class.queued]="config.status === 'Queued'" [class.completed]="config.status === 'Completed'">
                        {{ config.status }}
                    </span>
                </td>
                <td class="actions-cell">
                    <button class="icon-btn" title="Edit">✎</button>
                    <button class="icon-btn" title="Delete">🗑</button>
                    <button class="icon-btn" title="View">👁</button>
                    <button *ngIf="config.status === 'Configuring'" class="btn-manage"
                        (click)="onManage(config)">Manage</button>
                    <button *ngIf="config.status === 'Completed'" class="btn-manage btn-manage-orange"
                        (click)="onView(config)">Manage</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
